server:
  port: 8081

spring:
  application:
    name: order-fulfilment
  datasource:
    url: jdbc:h2:file:./data/orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

camunda:
  engine:
    base-url: http://localhost:8080/engine-rest